services:

  app:
    build:
      context: .
      # build com rede do host: contorna DNS quebrado do bridge em alguns ambientes
      network: host
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # uploads persistem fora do container (sobrevivem a restart/rebuild)
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - DATABASE_USER=${DB_USER}
      - DATABASE_PASS=${DB_PASSWORD}
      - DATABASE_DRIVER=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - JWT_SECRET=${JWT_SECRET}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8081}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - H2_CONSOLE_ENABLED=false

  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      # só localhost — no servidor, o Postgres nunca fica exposto pra fora
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
  uploads_data: