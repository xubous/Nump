spring.application.name=Nump

# 0. Porta do servidor — 8081 por padrão (8080 bloqueado na rede); sobrescrever via SERVER_PORT
server.port=${SERVER_PORT:8081}

# 1. Configuração do Data Source
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASS:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# 2. Configuração do Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update

# 3. H2 Console (apenas para teste local)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# 4. Segurança JWT — sem fallback, aplicação não sobe sem a variável definida
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# 5. URL base para links de download (deve bater com server.port)
app.base-url=${APP_BASE_URL:http://localhost:8081}

# 6. Limite de upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1GB

# 7. Validade padrão do link de download (temporário) e do link de coleta
app.link.expiracao-minutos=${APP_LINK_EXPIRACAO_MINUTOS:5}
app.coleta.expiracao-minutos=${APP_COLETA_EXPIRACAO_MINUTOS:120}

# 7b. Validade padrão do link de consentimento de acesso remoto (rápido por segurança)
app.acesso.expiracao-minutos=${APP_ACESSO_EXPIRACAO_MINUTOS:15}

# 7c. Ferramenta RustDesk — instalador que o script baixa na máquina do cliente
app.rustdesk.download-url=${RUSTDESK_DOWNLOAD_URL:https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.exe}

# 8. Webhook do n8n (vazio = desativado; nunca afeta o fluxo do upload/download)
n8n.webhook-url=${N8N_WEBHOOK_URL:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never