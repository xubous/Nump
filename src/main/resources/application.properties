spring.application.name=Nump

# Prioriza as variáveis do Render; se não existirem, usa o H2 local
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/nump}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASS:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# Hibernate: o dialeto é detectado automaticamente para Postgres ou H2
spring.jpa.hibernate.ddl-auto=update

# Console H2: Só liga se o driver for o do H2
spring.h2.console.enabled=true

# Segurança JWT
jwt.secret=${JWT_SECRET:8f3c9e12ab45cd78ef90gh12ij34kl56}
jwt.expiration=86400000