spring.application.name=Nump

# H2 — banco em memória, sobe junto com a aplicação sem precisar de nada externo
spring.datasource.url=jdbc:h2:mem:nump
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# cria/atualiza as tabelas automaticamente com base nas entidades @Entity
spring.jpa.hibernate.ddl-auto=update

# console web do H2 — acessível em http://localhost:8080/h2-console
spring.h2.console.enabled=true